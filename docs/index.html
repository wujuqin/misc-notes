<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>笔记</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main>
    <h1>笔记</h1>
    <form id="unlock">
      <label for="password">笔记口令</label>
      <div class="row"><input id="password" type="password" autocomplete="off" required placeholder="输入口令"><button id="decrypt" type="submit">打开笔记</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">输入口令查看笔记。</p>
    <section id="result" hidden>
      <div class="toolbar"><span>正文</span><div><button id="copy" type="button" class="secondary">复制全文</button><button id="clear" type="button" class="secondary">收起</button></div></div>
      <pre id="content" tabindex="0"></pre>
      <div id="images"></div>
    </section>
  </main>
  <script type="module" src="app.mjs?v=5"></script>
</body>
</html>
